services:
  - type: web
    name: workforceai-backend
    runtime: python
    rootDir: backend
    plan: starter

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput

    startCommand: |
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5

      - key: DEBUG
        value: "false"

      - key: SECRET_KEY
        generateValue: true

      - key: ALLOWED_HOSTS
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: SQLITE_DB_PATH
        value: /opt/render/project/src/data/db.sqlite3

      - key: PYTHONUNBUFFERED
        value: "1"
