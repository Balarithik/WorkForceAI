# Render Blueprint for the backend service only.
services:
  - type: web
    name: workforceai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "workforceai-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://workforceai.onrender.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://workforceai.onrender.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
      - key: SQLITE_DB_PATH
        value: "/app/db.sqlite3"
      - key: ML_MODEL_DIR
        value: "/app/ml_models"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
