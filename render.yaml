# Render Blueprint for WorkForceAI
# This file defines the infrastructure for deploying to Render.
# Replace YOUR_* placeholders with actual values after deployment.

services:
  # Backend Service (Django + Gunicorn)
  - type: web
    name: workforceai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "workforceai-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://workforceai.onrender.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://workforceai.onrender.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
      - key: SQLITE_DB_PATH
        value: "/app/db.sqlite3"
      - key: ML_MODEL_DIR
        value: "/app/ml_models"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true

  # Frontend Service (React + Nginx)
  - type: web
    name: workforceai
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://workforceai-backend.onrender.com/api"

# Note: For production use, consider:
# 1. Upgrading to paid plans for better performance and custom domains
# 2. Using PostgreSQL instead of SQLite for database persistence
# 3. Configuring custom domains instead of *.onrender.com
# 4. Setting up persistent disk for SQLite if using free tier